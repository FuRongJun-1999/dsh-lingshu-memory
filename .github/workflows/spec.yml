name: specification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Specification gates (not runtime acceptance)
        run: python -X utf8 -B scripts/check_all.py
        env:
          PYTHONUTF8: '1'
          PYTHONDONTWRITEBYTECODE: '1'
